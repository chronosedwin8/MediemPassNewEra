# =============================================================================
# Compilar en local lo que en producción se descarga.
#
# Se superpone al compose principal y solo añade lo que allí no está: cómo se
# construye cada imagen. Deliberadamente no repite nada más —ni variables, ni
# comprobaciones de salud, ni redes—, porque dos ficheros que describen lo
# mismo acaban describiéndolo distinto.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    # En local no hay proxy delante, así que aquí sí se publica un puerto.
    ports:
      - '${WEB_PORT:-8099}:80'
