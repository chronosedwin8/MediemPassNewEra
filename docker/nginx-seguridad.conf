# =============================================================================
# Cabeceras de seguridad, en un fichero aparte por una razón de nginx.
#
# `add_header` no se acumula: en cuanto un bloque `location` declara uno
# propio, deja de heredar TODOS los del bloque `server`. Como `/` y `/assets/`
# declaran su `Cache-Control`, la página principal se servía sin CSP, sin
# X-Frame-Options y sin Permissions-Policy —justo donde importan— y nada en la
# configuración lo delataba: se leía como si estuvieran puestas.
#
# Teniéndolas aquí, cada `location` que declare cabeceras propias incluye este
# fichero y vuelven a aplicarse. Es repetición, pero es repetición visible.
# =============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# `camera` y `microphone` en `self`, no vacíos.
#
# Estaban prohibidos del todo, y la cabecera es anterior a que existieran las
# preguntas que se responden con una selfie, un vídeo o una nota de voz:
# desplegar así habría dejado tres tipos de pregunta inservibles sin ningún
# error visible, porque el navegador se limita a negar el permiso.
# `geolocation` sigue vacío: nada en la plataforma la pide.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

# La CSP es estricta y se amplía por excepciones nombradas, nunca relajando una
# directiva entera. Cada origen está aquí porque una función concreta lo
# necesita:
#
#   connect-src  el bucket: las subidas van del navegador a S3 con una URL
#                firmada, sin pasar por nginx. Con solo 'self' el navegador
#                bloquearía cada evidencia, selfie y grabación, y la única
#                señal sería un error de red en la consola.
#   media-src    blob: porque quien graba ve su vídeo antes de enviarlo, y ese
#                preliminar es un blob del propio navegador.
#   frame-src    los reproductores admitidos en la capacitación docente.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://medienpass-caleman.s3.us-east-2.amazonaws.com; frame-src 'self' https://app.heygen.com https://www.youtube-nocookie.com https://player.vimeo.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
