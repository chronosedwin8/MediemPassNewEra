# =============================================================================
# nginx — sirve la aplicación compilada y hace de puerta al backend
#
# Que el frontend y la API compartan origen no es una comodidad: es lo que
# permite que la cookie de refresco sea `SameSite=Strict` sin excepciones y que
# no haga falta CORS con credenciales en producción.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No se anuncia la versión de nginx en las respuestas ni en las páginas de
    # error: es información gratuita para quien busca vulnerabilidades conocidas.
    server_tokens off;

    # --- Cabeceras de seguridad ----------------------------------------------
    # `Content-Security-Policy` es deliberadamente estricta. `connect-src 'self'`
    # basta porque la API vive en el mismo origen; si algún día se separan, hay
    # que ampliarla aquí y no desactivarla.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # `style-src` admite estilos en línea porque Vue los inyecta para las
    # transiciones y los estilos calculados. `script-src` no los admite, que es
    # donde de verdad importa.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 12m;

    # --- API ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generar treinta preguntas con IA puede tardar más de un minuto; el
        # valor por defecto de nginx (60 s) cortaría la respuesta a medias.
        proxy_read_timeout 180s;
    }

    # --- Recursos con huella --------------------------------------------------
    # Vite firma cada fichero con un hash del contenido: si cambia, cambia el
    # nombre. Por eso se pueden cachear indefinidamente sin miedo a servir una
    # versión vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- La aplicación --------------------------------------------------------
    # `index.html` NO se cachea: es lo que apunta a los recursos con hash, y
    # servir uno antiguo dejaría al navegador pidiendo ficheros que ya no están.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
